<div style="width: 1160px; height: 1599px; background: #c8c1ab; overflow: hidden;"><svg width="1160" height="1599" viewBox="0 0 1160 1599" xmlns="http://www.w3.org/2000/svg" style="display: block;"><rect width="1160" height="1599" fill="#c8c1ab"/><g transform="translate(20 20)"><rect width="552" height="224" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">NORTH AND WIND · TOP LEFT</text><text x="14" y="165" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">The rose becomes a needle; the feathered wind arrow becomes the meteorological station</text><text x="14" y="180" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">BARB, which is what a twentieth-century sheet draws. No declination diagram: we have no</text><text x="14" y="195" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">declination, and a sheet that drew one would be saying something it does not know.</text><text x="14" y="210" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">ADR-0021: a north arrow is the rose's hand, not a new piece.</text><g transform="translate(0 36)"><g transform="translate(44 62) scale(1)"><line x1="0" y1="30" x2="0" y2="-8" stroke="#2f3134" stroke-width="1.4"/><path d="M0 -24 L5 -4 L0 -9 L-5 -4 Z" fill="#2f3134"/><path d="M0 -24 L5 -4 L0 -9 Z" fill="#2f3134" fill-opacity="0.45"/><text x="0" y="-34" font-size="12" font-weight="600" letter-spacing="1" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">N</text></g><g transform="translate(142 62)"><g transform="translate(0 0)"><circle r="3" fill="none" stroke="#2f3134" stroke-width="1.2"/></g><text x="0" y="44" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">CALM</text></g><g transform="translate(236 62)"><g transform="translate(0 0)"><circle r="3" fill="none" stroke="#2f3134" stroke-width="1.2"/><g transform="rotate(472)" stroke="#2f3134" stroke-width="1.5" fill="#2f3134" stroke-linecap="round"><line x1="0" y1="-3" x2="0" y2="-30"/><line x1="0" y1="-30" x2="5.5" y2="-27.5"/></g></g><text x="0" y="44" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">LIGHT</text></g><g transform="translate(330 62)"><g transform="translate(0 0)"><circle r="3" fill="none" stroke="#2f3134" stroke-width="1.2"/><g transform="rotate(472)" stroke="#2f3134" stroke-width="1.5" fill="#2f3134" stroke-linecap="round"><line x1="0" y1="-3" x2="0" y2="-30"/><line x1="0" y1="-30" x2="11" y2="-25"/></g></g><text x="0" y="44" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">MODERATE</text></g><g transform="translate(424 62)"><g transform="translate(0 0)"><circle r="3" fill="none" stroke="#2f3134" stroke-width="1.2"/><g transform="rotate(472)" stroke="#2f3134" stroke-width="1.5" fill="#2f3134" stroke-linecap="round"><line x1="0" y1="-3" x2="0" y2="-30"/><line x1="0" y1="-30" x2="11" y2="-25"/><line x1="0" y1="-24" x2="11" y2="-19"/></g></g><text x="0" y="44" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">FRESH</text></g><g transform="translate(518 62)"><g transform="translate(0 0)"><circle r="3" fill="none" stroke="#2f3134" stroke-width="1.2"/><g transform="rotate(472)" stroke="#2f3134" stroke-width="1.5" fill="#2f3134" stroke-linecap="round"><line x1="0" y1="-3" x2="0" y2="-30"/><path d="M0 -30 L11 -25 L0 -20 Z" stroke="none"/></g></g><text x="0" y="44" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">GALE</text></g></g></g><g transform="translate(588 20)"><rect width="552" height="224" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">SCALE BAR · BOTTOM LEFT</text><text x="14" y="165" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">Alternating blocks with the numerals under the divisions and the unit named at the end,</text><text x="14" y="180" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">where the plate rules a hairline bar with ticks and writes the whole distance above it.</text><text x="14" y="195" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">The one piece that never leaves, in either mode: nothing else says how big the ground</text><text x="14" y="210" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">is.</text><g transform="translate(60 36)"><rect x="0" y="27" width="24" height="7" fill="#2f3134" stroke="#2f3134" stroke-width="0.9"/><rect x="24" y="27" width="24" height="7" fill="none" stroke="#2f3134" stroke-width="0.9"/><rect x="48" y="27" width="24" height="7" fill="#2f3134" stroke="#2f3134" stroke-width="0.9"/><rect x="72" y="27" width="24" height="7" fill="none" stroke="#2f3134" stroke-width="0.9"/><rect x="96" y="27" width="24" height="7" fill="#2f3134" stroke="#2f3134" stroke-width="0.9"/><text x="0" y="45" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">0</text><text x="24" y="45" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">1</text><text x="48" y="45" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">2</text><text x="72" y="45" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">3</text><text x="96" y="45" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">4</text><text x="120" y="45" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">5</text><text x="130" y="31" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2f3134" text-anchor="start" dominant-baseline="middle">NAUTICAL MILES</text><g transform="translate(0 96)"><g stroke="#2f3134" stroke-width="1.5"><line x1="0" y1="0" x2="120" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/><line x1="120" y1="-5" x2="120" y2="5"/><line x1="24" y1="-3" x2="24" y2="3"/><line x1="48" y1="-3" x2="48" y2="3"/><line x1="72" y1="-3" x2="72" y2="3"/><line x1="96" y1="-3" x2="96" y2="3"/></g><text x="0" y="-8" font-size="12" font-style="italic" fill="#2f3134">5 nautical miles</text><text x="150" y="-2" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.6" text-anchor="start" dominant-baseline="middle">the chart plate's, for comparison</text></g></g></g><g transform="translate(20 268)"><rect width="552" height="336" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">LEGEND · BOTTOM LEFT, ABOVE THE SCALE BAR</text><text x="14" y="292" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">The sheet's marginal key: a heavy head rule, caps, and rows sampling THE VIEW'S OWN</text><text x="14" y="307" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">GLYPH — which is why this legend shows staff frames while the plate's shows ticks, with</text><text x="14" y="322" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">no pass anywhere knowing that either view exists.</text><g transform="translate(160 36)"><g transform="translate(0 216)"><rect x="0" y="-216" width="214" height="216" fill="rgba(222,215,194,0.94)" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="-216" x2="214" y2="-216" stroke="#2f3134" stroke-width="3"/><text x="12" y="-199" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">LEGEND</text><line x1="12" y1="-190" x2="202" y2="-190" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.5"/><g transform="translate(46 -172)"><g transform="scale(0.62)"><rect x="-34" y="-9" width="68" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-34" y="-9" width="68" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-34" y1="-9" x2="34" y2="-9" stroke="#9c3327" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/></g></g><text x="92" y="-172" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#9c3327" text-anchor="start" dominant-baseline="middle">ROMAN</text><g transform="translate(46 -150)"><g transform="scale(0.62)"><rect x="-34" y="-9" width="68" height="18" fill="#1f4f7a" fill-opacity="0.22"/><rect x="-34" y="-9" width="68" height="18" fill="none" stroke="#1f4f7a" stroke-width="1.5"/><line x1="-34" y1="-9" x2="34" y2="-9" stroke="#1f4f7a" stroke-width="3.2" stroke-linecap= t-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">ENGAGED</text><g transform="translate(46 -84)"><g transform="scale(0.62)"><rect x="-34" y="-9" width="27.2" height="18" fill="#2f3134" fill-opacity="0.12"/><rect x="-34" y="-9" width="68" height="18" fill="none" stroke="#2f3134" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/></g></g><text x="92" y="-84" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">BROKEN</text><g transform="translate(46 -62)"><g transform="scale(0.62)"><rect x="-34" y="-9" width="68" height="18" fill="none" stroke="#2f3134" stroke-width="1.1" stroke-opacity="0.75"/><line x1="-34" y1="-9" x2="34" y2="9" stroke="#2f3134" stroke-width="1.6" stroke-linecap="round"/><line x1="-34" y1="9" x2="34" y2="-9" stroke="#2f3134" stroke-width="1.6" stroke-linecap="round"/></g></g><text x="92" y="-62" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">DESTROYED</text><g transform="translate(46 -40)"><g transform="scale(0.62)"><rect x="-34" y="-9" width="68" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-34" y="-9" width="68" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-34" y1="-9" x2="34" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/></g></g><text x="92" y="-40" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">INFANTRY</text><g transform="translate(46 -18)"><g transform="scale(0.62)"><rect x="-34" y="-9" width="68" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-34" y="-9" width="68" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-34" y1="-9" x2="34" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/></g></g><text x="92" y="-18" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">CAVALRY</text></g></g></g><g transform="translate(588 268)"><rect width="552" height="336" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">TITLE · TOP RIGHT   ·   CREDIT · BOTTOM RIGHT   ·   THE NEAT LINE</text><text x="14" y="277" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">Caps and tracked for the sheet name; the credit in the marginal-data hand, small caps at</text><text x="14" y="292" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">the foot. Both take paper panels, because the graticule runs under every corner at every</text><text x="14" y="307" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">extent (#138). The plate's doubled hairline becomes a heavy outer rule with a fine inner</text><text x="14" y="322" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">one.</text><g transform="translate(276 36)"><rect x="-166" y="0" width="332" height="32" fill="rgba(222,215,194,0.94)" stroke="#2f3134" stroke-width="0.8"/><text x="154" y="17" font-size="19" font-weight="600" letter-spacing="1.5" fill="#2f3134" text-anchor="end" dominant-baseline="middle">THE BATTLE OF CANNAE</text><rect x="-166" y="48" width="332" height="22" fill="rgba(222,215,194,0.94)" stroke="#2f3134" stroke-width="0.8"/><text x="154" y="59" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.85" text-anchor="end" dominant-baseline="middle">RELIEF: SRTM GL1 (PUBLIC DOMAIN)</text><g transform="translate(-166 88)"><g fill="none" stroke="#2f3134"><rect x="1" y="1" width="330" height="46" stroke-width="2"/><rect x="6.5" y="6.5" width="319" height="35" stroke-width="0.7"/></g><text x="166" y="25" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.75" text-anchor="middle" dominant-baseline="middle">THE NEAT LINE</text></g></g></g><g transform="translate(20 628)"><rect width="1120" height="198" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="1120" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THE CAPTION BAND</text><text x="14" y="169" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">Full width below the plate with the clock at the left, and its slots, are anatomy. The hand is the view's: one heavy rule where the plate doubles a hairline, a vertical rule ruling the</text><text x="14" y="184" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">clock column off the prose the way a printed form does, tabular figures, and caps for the date, the phase and the credit — and, again, no italic anywhere.</text><g transform="translate(6 36)"><g transform="scale(0.98)"><rect x="0" y="0" width="1120" height="96" fill="#ded7c2"/><line x1="0" y1="1.5" x2="1120" y2="1.5" stroke="#2f3134" stroke-width="3"/><line x1="152" y1="14" x2="152" y2="84" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.45"/><text x="24" y="34" font-size="30" font-weight="500" fill="#2f3134" style="font-variant-numeric: tabular-nums;" dominant-baseline="middle">14:20</text><text x="24" y="58" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.9" text-anchor="start" dominant-baseline="middle">2 AUGUST 216 BC</text><text x="176" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THE LIBYANS CLOSE ON BOTH FLANKS</text><text x="176" y="42" font-size="15" font-weight="400" fill="#2f3134" text-anchor="start" dominant-baseline="middle">The Gallic and Spanish centre has given back to its starting line and beyond it, drawing the legions into the bow; on either flank the</text><text x="176" y="62" font-size="15" font-weight="400" fill="#2f3134" text-anchor="start" dominant-baseline="middle">Libyan columns wheel inward on the Roman shoulders, and Hasdrubal's horse comes up behind the maniples from the river.</text><text x="176" y="82" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.8" text-anchor="start" dominant-baseline="middle">— POLYBIUS III.113–116, LIVY XXII.44–49</text></g></g></g><g transform="translate(20 850)"><rect width="1120" height="288" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="1120" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THE LABEL AND ITS LEADER</text><text x="14" y="229" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">Two lines on the glyph's flank, never ahead of the unit, in the collapse order the anatomy fixes. The hand: the NAME IN CAPS AND TRACKED in the side ink, the fact upper-lower
