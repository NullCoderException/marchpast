<div style="width: 1160px; height: 854px; background: #c8c1ab; overflow: hidden; font-family: {{face}}; font-stretch: {{stretch}};"><svg width="1160" height="854" viewBox="0 0 1160 854" xmlns="http://www.w3.org/2000/svg" style="display: block;"><rect width="1160" height="854" fill="#c8c1ab"/><g transform="translate(20 20)"><rect width="552" height="329" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">PEN · WHAT `PENS` CAN EXPRESS TODAY</text><text x="14" y="285" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">A width, a dash, a head shape and a head size. Nothing else. Legible, cheap, and no new</text><text x="14" y="300" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">slot: `pens` stays exactly as ADR-0021 left it. But a 5 px stroked line with a barb is a</text><text x="14" y="315" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">THICK LINE, not a broad arrow.</text><g transform="translate(20 36)"><g transform="translate(16 42)"><line x1="0" y1="0" x2="236" y2="0" stroke="#2f3134" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 5"/><g transform="translate(236 0) rotate(0)"><path d="M-8 -4.4 L0 0 L-8 4.4" fill="none" stroke="#2f3134" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="258" y="-8" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">TRACK</text><text x="258" y="8" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.7" text-anchor="start" dominant-baseline="middle">where it came from</text></g><g transform="translate(16 116)"><line x1="0" y1="0" x2="236" y2="0" stroke="#2f3134" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 7"/><g transform="translate(236 0) rotate(0)"><path d="M-14 -7.7 L0 0 L-14 7.7" fill="none" stroke="#2f3134" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="258" y="-8" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">INTENT</text><text x="258" y="8" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.7" text-anchor="start" dominant-baseline="middle">where it is going</text></g><g transform="translate(16 190)"><line x1="0" y1="0" x2="223.4" y2="0" stroke="#9c3327" stroke-width="5" stroke-linecap="round"/><g transform="translate(236 0) rotate(0)"><path d="M0 0 L-18 -9 L-12.6 0 L-18 9 Z" fill="#9c3327"/></g><text x="258" y="-8" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">DETACHMENT</text><text x="258" y="8" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.7" text-anchor="start" dominant-baseline="middle">an ordered move of part</text></g></g></g><g transform="translate(588 20)"><rect width="552" height="329" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">TAPER · WHAT AN OPERATIONS MAP DRAWS</text><text x="14" y="285" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">A polygon that tapers from tail to shoulder and opens into the head: hollow for intent,</text><text x="14" y="300" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">solid for a detachment, curved along its axis, and sized to its own run. It cannot come</text><text x="14" y="315" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">out of a Pen at any values.</text><g transform="translate(20 36)"><g transform="translate(16 42)"><circle cx="0" cy="0" r="2.6" fill="none" stroke="#2f3134" stroke-width="1.2"/><line x1="4" y1="0" x2="236" y2="0" stroke="#2f3134" stroke-width="1.2"/><line x1="26" y1="-3.5" x2="26" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="52" y1="-3.5" x2="52" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="78" y1="-3.5" x2="78" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="104" y1="-3.5" x2="104" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="130" y1="-3.5" x2="130" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="156" y1="-3.5" x2="156" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="182" y1="-3.5" x2="182" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><line x1="208" y1="-3.5" x2="208" y2="3.5" stroke="#2f3134" stroke-width="1.1"/><g transform="translate(236 0) rotate(0)"><path d="M-8 -4.5 L0 0 L-8 4.5" fill="none" stroke="#2f3134" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="258" y="-8" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">TRACK</text><text x="258" y="8" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.7" text-anchor="start" dominant-baseline="middle">where it came from</text></g><g transform="translate(16 116)"><path d="M0 3 L210 12.39 L210 20.39 L236 0 L210 -13.61 L210 -5.61 L0 -3 Z" fill="#ded7c2" stroke="#2f3134" stroke-width="1.5" stroke-linejoin="round"/><text x="258" y="-8" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">INTENT</text><text x="258" y="8" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.7" text-anchor="start" dominant-baseline="middle">where it is going</text></g><g transform="translate(16 190)"><path d="M0 4 L206 11 L206 20 L236 0 L206 -20 L206 -11 L0 -4 Z" fill="#9c3327" stroke="#9c3327" stroke-width="1" stroke-linejoin="round"/><text x="258" y="-8" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">DETACHMENT</text><text x="258" y="8" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.7" text-anchor="start" dominant-baseline="middle">an ordered move of part</text></g></g></g><g transform="translate(20 373)"><rect width="552" height="287" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THREE STYLES CROSSING · PEN</text><text x="14" y="258" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">The anatomy's test: three motion styles tellable apart where they overlap. Pen passes it</text><text x="14" y="273" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">— dash and weight are enough — but all three read as one family of line.</text><g transform="translate(120 36)"><line x1="16" y1="128" x2="208" y2="70" stroke="#2f3134" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 5"/><g transform="translate(208 70) rotate(-16.81)"><path d="M-8 -4.4 L0 0 L-8 4.4" fill="none" stroke="#2f3134" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="60" y1="26" x2="262" y2="100" stroke="#2f3134" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 7"/><g transform="translate(262 100) rotate(20.12)"><path d="M-14 -7.7 L0 0 L-14 7.7" fill="none" stroke="#2f3134" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="34" y1="156" x2="262.77" y2="39.71" stroke="#1f4f7a" stroke-width="5" stroke-linecap="round"/><g transform="translate(274 34) rotate(-26.95)"><path d="M0 0 L-18 -9 L-12.6 0 L-18 9 Z" fill="#1f4f7a"/></g></g></g><g transform="translate(588 373)"><rect width="552" height="287" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THREE STYLES CROSSING · TAPER</text><text x="14" y="243" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">Taper passes it more widely: a pipped line, a hollow arrow and a solid one are three</text><text x="14" y="258" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">MATERIALS, not three weights, so the reading survives the crowding Trafalgar 13:30</text><text x="14" y="273" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">actually reaches.</text><g transform="translate(120 36)"><circle cx="16" cy="128" r="2.6" fill="none" stroke="#2f3134" stroke-width="1.2"/><line x1="19.83" y1="126.84" x2="208" y2="70" stroke="#2f3134" stroke-width="1.2"/><line x1="39.88" y1="117.13" x2="41.9" y2="123.83" stroke="#2f3134" stroke-width="1.1"/><line x1="64.77" y1="109.61" x2="66.79" y2="116.31" stroke="#2f3134" stroke-width="1.1"/><line x1="89.66" y1="102.09" x2="91.68" y2="108.79" stroke="#2f3134" stroke-width="1.1"/><line x1="114.54" y1="94.58" x2="116.57" y2="101.28" stroke="#2f3134" stroke-width="1.1"/><line x1="139.43" y1="87.06" x2="141.46" y2="93.76" stroke="#2f3134" stroke-width="1.1"/><line x1="164.32" y1="79.54" x2="166.35" y2="86.24" stroke="#2f3134" stroke-width="1.1"/><line x1="189.21" y1="72.02" x2="191.24" y2="78.72" stroke="#2f3134" stroke-width="1.1"/><g transform="translate(208 70) rotate(-16.81)"><path d="M-8 -4.5 L0 0 L-8 4.5" fill="none" stroke="#2f3134" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M58.97 28.82 L232.71 104.38 L229.95 111.89 L262 100 L241.65 79.97 L238.9 87.48 L61.03 23.18 Z" fill="#ded7c2" stroke="#2f3134" stroke-width="1.5" stroke-linejoin="round"/><path d="M35.81 159.57 L252.24 57.4 L256.32 65.42 L274 34 L238.19 29.77 L242.27 37.79 L32.19 152.43 Z" fill="#1f4f7a" stroke="#1f4f7a" stroke-width="1" stroke-linejoin="round"/></g></g><g transform="translate(20 684)"><rect width="1120" height="150" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="1120" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THE DECISION ADR-0021 ASKED FOR, AGAINST A DRAWING</text><text x="14" y="61" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">ADR-0021: "if #139's drawing shows that a tapered operations arrow cannot be had from a width, a dash and a head, the handoff cuts a `moves` hand then, against a drawing. Coming back to</text><text x="14" y="76" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">ask is the expected path, not a failure."</text><text x="14" y="91" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">It cannot. A taper needs a width that VARIES along the shaft, which is a polygon and not a stroke; and a hollow head needs a fill distinct from its stroke, which `Pen` has no field for.</text><text x="14" y="106" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">So either the staff map takes the fifth slot — a `moves` hand of three functions — or it accepts the PEN column, which is a legitimate answer: the three styles stay tellable apart and</text><text x="14" y="121" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">no view yet needs the taper except on aesthetic grounds.</text><text x="14" y="136" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">What is NOT an option is a taper factor on `Pen`. It would put a value on every view for one view's polygon, which is exactly the general table of overridable passes ADR-0021 rejected.</text><g transform="translate(20 36)"></g></g></svg></div>

<script data-dc-script data-props='{"face":{"editor":"enum","options":["plex","archivo","barlow"],"default":"plex","section":"View"}}'>
