<div style="width: 1160px; height: 1126px; background: #c8c1ab; overflow: hidden; font-family: {{face}}; font-stretch: {{stretch}};"><svg width="1160" height="1126" viewBox="0 0 1160 1126" xmlns="http://www.w3.org/2000/svg" style="display: block;"><rect width="1160" height="1126" fill="#c8c1ab"/><g transform="translate(20 20)"><rect width="552" height="263" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="552" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">A · FRAME TO FRONTAGE</text><text x="14" y="219" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">The unit's whole footprint is the symbol: the box IS the 72 px. For: mass at a glance;</text><text x="14" y="234" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">strength reads as area; nothing to learn. Against: a 4:1 box is not the aspect the</text><text x="14" y="249" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">symbol tradition reads at, and a mass at 36 × 36 is a small square.</text><g transform="translate(276 36)"><g transform="translate(0 62) scale(2.1)"><rect x="-36" y="-9" width="54" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#9c3327" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/></g><line x1="0" y1="43.1" x2="-256" y2="14" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.6"/><circle cx="0" cy= nant-baseline="middle">B · SYMBOL ON THE TRACE</text><text x="14" y="219" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">A 72 px unit trace with a true-aspect symbol box astride it. For: the real</text><text x="14" y="234" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">operations-map shape, and the arm mark gets a 3:2 field. Against: two marks per unit,</text><text x="14" y="249" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">and lighter, so a weak unit reads faintly at a crowded extent.</text><g transform="translate(276 36)"><g transform="translate(0 62) scale(2.1)"><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="1" stroke-opacity="0.3"/><line x1="-18" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="3.2" stroke-linecap="butt"/><line x1="0" y1="0" x2="0" y2="-15" stroke="#9c3327" stroke-width="1.4"/><rect x="-15" y="-9.5" width="30" height="19" fill="#9c3327" fill-opacity="0.2"/><rect x="-15" y="-9.5" width="30" height="19" fill="#ded7c2" fill-opacity="0.55"/><rect x="-15" y="-9.5" width="30" height="19" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-9.23" y1="6.84" x2="9.23" y2="-6.84" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><line x1="-9.23" y1="-6.84" x2="9.23" y2="6.84" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/></g><line x1="-75.6" y1="62" x2="-256" y2="122" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.6"/><circle cx="-75.6" cy="62" r="1.8" fill="#2f3134" fill-opacity="0.6"/><text x="-256" y="122" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.9" text-anchor="start" dominant-baseline="middle">THE TRACE: 72 PX, GHOSTED WHERE IT IS LOST</text><line x1="0" y1="32.6" x2="-256" y2="14" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.6"/><circle cx="0" cy="32.6" r="1.8" fill="#2f3134" fill-opacity="0.6"/><text x="-256" y="14" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.9" text-anchor="start" dominant-baseline="middle">THE FRONT TICK</text><line x1="15" y1="53" x2="256" y2="122" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.6"/><circle cx="15" cy="53" r="1.8" fill="#2f3134" fill-opacity="0.6"/><text x="256" y="122" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.9" text-anchor="end" dominant-baseline="middle">A TRUE-ASPECT BOX, 30 × 19, ASTRIDE IT</text><line x1="-50.4" y1="62" x2="256" y2="142" stroke="#2f3134" stroke-width="0.7" stroke-opacity="0.6"/><circle cx="-50.4" cy="62" r="1.8" fill="#2f3134" fill-opacity="0.6"/><text x="256" y="142" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" fill-opacity="0.9" text-anchor="end" dominant-baseline="middle">STRENGTH SHORTENS IT FROM THE REAR</text></g></g><g transform="translate(20 307)"><rect width="1120" height="175" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><line x1="0" y1="1" x2="1120" y2="1" stroke="#2f3134" stroke-width="2.5"/><text x="14" y="20" font-size="11.5" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="start" dominant-baseline="middle">THE FOUR STATES · A, AND · B</text><text x="14" y="131" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">Intact keeps the heavy front edge. Engaged serrates it into the operations map's own CONTACT LINE — drawn inside the unit's own footprint, so this glyph lays nothing down before the</text><text x="14" y="146" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">bodies and has no `mark` half at all, which the Glyph interface already allows for. Broken dashes the frame and drops the tint. Destroyed is struck out and stays in the SIDE INK,</text><text x="14" y="161" font-size="12" font-weight="400" fill="#2f3134" fill-opacity="0.85" text-anchor="start" dominant-baseline="middle">because ink is the only carrier of side (#130).</text><g transform="translate(20 36)"><g transform="translate(62 30)"><rect x="-36" y="-9" width="72" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#9c3327" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><text x="0" y="46" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">INTACT</text></g><g transform="translate(194 30)"><rect x="-36" y="-9" width="72" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><path d="M-36 -9 L-33 -13.8 L-30 -9 L-27 -13.8 L-24 -9 L-21 -13.8 L-18 -9 L-15 -13.8 L-12 -9 L-9 -13.8 L-6 -9 L-3 -13.8 L0 -9 L3 -13.8 L6 -9 L9 -13.8 L12 -9 L15 -13.8 L18 -9 L21 -13.8 L24 -9 L27 -13.8 L30 -9 L33 -13.8 L36 -9" fill="none" stroke="#9c3327" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round"/><text x="0" y="46" font-size="10" font-weight="400" letter-spacing="0.7" fill="#2f3134" text-anchor="middle" dominant-baseline="middle">ENGAGED</text></g><g transform="translate(326 30)"><rect x="-36" y="-9" width="28.8" height="18" fill="#9c3327" fill-opacity="0.12"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5" stro
