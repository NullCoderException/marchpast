  <text x="40" y="76" font-size="14" font-style="italic" fill="#2b2418" fill-opacity="0.88">ADR-0018 closed the state list at four and ADR-0024 said what each means for a strike: intact on deck and en route, engaged from the attack, broken when it scatters, destroyed when nothing comes home.</text>
