  <text x="40" y="76" font-size="14" font-style="italic" fill="#2b2418" fill-opacity="0.88">ADR-0024 fixed the position and left the reading open: a launch phase puts the strike on its carrier and it tweens outward; a recovery phase brings it home and it is struck below. Three ways that can</text>
  <text x="40" y="95" font-size="14" font-style="italic" fill="#2b2418" fill-opacity="0.88">look, none of them a schema change.</text>

<g transform="translate(40 140)"><rect width="390" height="256" fill="#efe3c6" stroke="#2b2418" stroke-width="1"/><text x="14" y="24" font-size="14" fill="#2b2418" letter-spacing="0.6">1 · As ADR-0024 leaves it</text><line x1="14" y1="33" x2="376" y2="33" stroke="#2b2418" stroke-width="0.6" stroke-opacity="0.5"/><text x="14" y="167" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">The strike's position IS the carrier's, and its formation is its</text><text x="14" y="182" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">own — line, for a squadron ranged abreast. Eight aeroplanes</text><text x="14" y="197" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">across eight chevrons at one point, in one ink, and the crosses</text><text x="14" y="212" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">land between the chevrons rather than beside them. Two labels</text><text x="14" y="227" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">want the same flank as well, and the label pass has no rule that</text><text x="14" y="242" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">says which unit owns it.</text><g transform="translate(195 64)"><g transform="translate(0 0) rotate(232)"><g transform="translate(0 -31.5) rotate(0)"><path d="M-2.6 3.25 L0 -3.25 L2.6 3.25" fill="none" stroke="#8f2f24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 -22.5) rotate(0)"><path d="M-2.6 3.25 L0 -3.25 L2.6 3.25" fill="none" stroke="#8f2f24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 -13.5) rotate(0)"><path d="M-2.6 3.25 L0 -3.25 L2.6 3.25" fill="none" stroke="#8f2f24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 -4.5) rotate(0)"><path d="M-2.6 3.25 L0 -3.25 L2.6 3.25" fill="none" stroke="#8f2f24" stroke-width="1.4"
