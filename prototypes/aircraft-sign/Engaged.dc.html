  <text x="40" y="46" font-size="26" fill="#2b2418">The engaged mark on a unit that is mostly sky</text>
  <text x="40" y="76" font-size="14" font-style="italic" fill="#2b2418" fill-opacity="0.88">The plate's engaged mark is Billow: outlined puffs merging into one scalloped cloud, drifting off the unit's lee flank under the phase's wind (ADR-0014, ADR-0016). Nothing about it was drawn with</text>
  <text x="40" y="95" font-size="14" font-style="italic" fill="#2b2418" fill-opacity="0.88">aeroplanes in mind.</text>
  <line x1="40" y1="118" x2="1260" y2="118" stroke="#2b2418" stroke-width="1"/>
  <line x1="40" y1="121" x2="1260" y2="121" stroke="#2b2418" stroke-width="0.5"/>
<g transform="translate(40 140)"><rect width="1220" height="268" fill="#efe3c6" stroke="#2b2418" stroke-width="1"/><text x="14" y="24" font-size="14" fill="#2b2418" letter-spacing="0.6">Where the cloud goes</text><line x1="14" y1="33" x2="1206" y2="33" stroke="#2b2418" stroke-width="0.6" stroke-opacity="0.5"/><text x="14" y="209" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">ADR-0016 made Billow the engaged mark for EVERY arm and refused a second one by name: a separate land mark would be a second vocabulary the legend keys twice. On land the cloud reads as dust; over the sea it is</text><text x="14" y="224" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">gunsmoke. On a body of aeroplanes three thousand feet up it reads as flak — outlined puffs hanging in the air is exactly what a 1940s plate draws anti-aircraft fire as — so the mark needs no change at all. What is</text><text x="14" y="239" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">worth arguing about is the WIND: ADR-0014 blows the cloud to the unit's lee flank under the phase's surface wind, and a burst at altitude does not drift with the surface wind. The two are drawn side by side; neither</text><text x="14" y="254" font-size="11.5" font-style="italic" fill="#2b2418" fill-opacity="0.9">is a new mark, and only the second costs an arm-dependent branch in the shared mark pass.</text><g transform="translate(250 92)"><g transform="translate(0 0)"><g transform="rotate(200)"><path d="M9.18 3.89 A3.5 3.5 0 1 0 16.18 3.89 A3.5 3.5 0 1 0 9.18 3.89 Z M-14.28 5.09 A3.93 3.93 0 1 0 -6.41 5.09 A3.93 3.93 0 1 0 -14.28 5.09 Z M-5.22 6.29 A4.37 4.37 0 1 0 3.51 6.29 A4.37 4.37 0 1 0 -5.22 6.29 Z M-11.09 7.49 A4.8 4.8 0 1 0 -1.49 7.49 A4.8 4.8 0 1 0 -11.09 7.49 Z M18.51 8.7 A5.23 5.23 0 1 0 28.98 8.7 A5.23 5.23 0 1 0 18.51 8.7 Z M15.35 9.9 A5.67 5.67 0 1 0 26.69 9.9 A5.67 5.67 0 1 0 15.35 9.9 Z M-10.22 11.1 A6.1 6.1 0 1 0 1.98 11.1 A6.1 6.1 0 1 0 -10.22
