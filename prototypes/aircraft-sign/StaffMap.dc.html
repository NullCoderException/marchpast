<svg width="1300" height="703" viewBox="0 0 1300 703" xmlns="http://www.w3.org/2000/svg">
  <rect width="1300" height="703" fill="#c8c1ab"/>
  <text x="40" y="46" font-size="26" fill="#2f3134">The staff map: the symbol-tradition mark</text>
  <text x="40" y="76" font-size="14" font-style="italic" fill="#2f3134" fill-opacity="0.88">#139 drew three arm marks and greyed the fourth, saying in words that whether aircraft is an arm at all was #131's and what its sign looks like is this ticket's. ADR-0024 answered the first. This</text>
  <text x="40" y="95" font-size="14" font-style="italic" fill="#2f3134" fill-opacity="0.88">answers the second.</text>
  <text x="40" y="114" font-size="14" font-style="italic" fill="#2f3134" fill-opacity="0.88">The glyph itself is still #139's open choice (A frame-to-frontage or B symbol-on-the-trace); the mark is drawn on both, because it has to survive either.</text>
  <line x1="40" y1="137" x2="1260" y2="137" stroke="#2f3134" stroke-width="1"/>
  <line x1="40" y1="140" x2="1260" y2="140" stroke="#2f3134" stroke-width="0.5"/>
<g transform="translate(40 159)"><rect width="390" height="308" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><text x="14" y="24" font-size="14" fill="#2f3134" letter-spacing="0.6">A · Delta</text><line x1="14" y1="33" x2="376" y2="33" stroke="#2f3134" stroke-width="0.6" stroke-opacity="0.5"/><text x="14" y="249" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">#139's own, drawn greyed on its boards and labelled a candidate</text><text x="14" y="264" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">for this ticket. A filled swept arrowhead with a notched tail:</text><text x="14" y="279" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">the symbol tradition's mark for air, and the loudest thing in the</text><text x="14" y="294" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">box.</text><g transform="translate(175 60)"><g transform="translate(0 0)"><rect x="-36" y="-9" width="72" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#9c3327" stroke-width="3.2" stroke-linecap="square"/><path d="M-9.19 7.45 L0 -7.45 L9.19 7.45 L0 1.86 Z" fill="#9c3327" stroke="#9c3327" stroke-width="1.08" stroke-linejoin="round"/></g><g transform="translate(0 62)"><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="1" stroke-opacity="0.3"/><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="3.2" stroke-linecap="butt"/><line x1="0" y1="0" x2="0" y2="-15" stroke="#9c3327" stroke-width="1.4"/><rect x="-15" y="-9.5" width="30" height="19" fill="#9c3327" fill-opacity="0.2"/><rect x="-15" y="-9.5" width="30" height="19" fill="#ded7c2" fill-opacity="0.55"/><rect x="-15" y="-9.5" width="30" height="19" fill="none" stroke="#9c3327" stroke-width="1.5"/><path d="M-9.7 7.87 L0 -7.87 L9.7 7.87 L0 1.97 Z" fill="#9c3327" stroke="#9c3327" stroke-width="1.08" stroke-linejoin="round"/></g><g transform="translate(0 128) scale(0.62)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M-9.19 7.45 L0 -7.45 L9.19 7.45 L0 1.86 Z" fill="#2f3134" stroke="#2f3134" stroke-width="1.08" stroke-linejoin="round"/></g><text x="0" y="30" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">on #139's candidate A, frame to frontage</text><text x="0" y="92" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">on #139's candidate B, symbol on the trace</text><text x="0" y="158" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">legend scale, 0.62</text></g></g><g transform="translate(454 159)"><rect width="390" height="308" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><text x="14" y="24" font-size="14" fill="#2f3134" letter-spacing="0.6">B · Outline</text><line x1="14" y1="33" x2="376" y2="33" stroke="#2f3134" stroke-width="0.6" stroke-opacity="0.5"/><text x="14" y="264" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">The same shape stroked rather than filled, so it weighs what its</text><text x="14" y="279" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">three siblings weigh — foot's crossed lines, horse's single one,</text><text x="14" y="294" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">and the hollow hull in plan the ship takes.</text><g transform="translate(175 60)"><g transform="translate(0 0)"><rect x="-36" y="-9" width="72" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#9c3327" stroke-width="3.2" stroke-linecap="square"/><path d="M-9.19 7.45 L0 -7.45 L9.19 7.45 L0 1.86 Z" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linejoin="round"/></g><g transform="translate(0 62)"><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="1" stroke-opacity="0.3"/><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="3.2" stroke-linecap="butt"/><line x1="0" y1="0" x2="0" y2="-15" stroke="#9c3327" stroke-width="1.4"/><rect x="-15" y="-9.5" width="30" height="19" fill="#9c3327" fill-opacity="0.2"/><rect x="-15" y="-9.5" width="30" height="19" fill="#ded7c2" fill-opacity="0.55"/><rect x="-15" y="-9.5" width="30" height="19" fill="none" stroke="#9c3327" stroke-width="1.5"/><path d="M-9.7 7.87 L0 -7.87 L9.7 7.87 L0 1.97 Z" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linejoin="round"/></g><g transform="translate(0 128) scale(0.62)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M-9.19 7.45 L0 -7.45 L9.19 7.45 L0 1.86 Z" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linejoin="round"/></g><text x="0" y="30" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">on #139's candidate A, frame to frontage</text><text x="0" y="92" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">on #139's candidate B, symbol on the trace</text><text x="0" y="158" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">legend scale, 0.62</text></g></g><g transform="translate(868 159)"><rect width="390" height="308" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><text x="14" y="24" font-size="14" fill="#2f3134" letter-spacing="0.6">C · Plan</text><line x1="14" y1="33" x2="376" y2="33" stroke="#2f3134" stroke-width="0.6" stroke-opacity="0.5"/><text x="14" y="264" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">The aeroplane in plan again, so all four views draw the arm one</text><text x="14" y="279" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">way. ADR-0015's own argument for foot and horse: a viewer who</text><text x="14" y="294" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">switches views carries the same reading across.</text><g transform="translate(175 60)"><g transform="translate(0 0)"><rect x="-36" y="-9" width="72" height="18" fill="#9c3327" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#9c3327" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#9c3327" stroke-width="3.2" stroke-linecap="square"/><path d="M0 -7.13 L0 7.13" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9.19 -1.78 L9.19 -1.78" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3.86 4.99 L3.86 4.99" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 62)"><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="1" stroke-opacity="0.3"/><line x1="-36" y1="0" x2="36" y2="0" stroke="#9c3327" stroke-width="3.2" stroke-linecap="butt"/><line x1="0" y1="0" x2="0" y2="-15" stroke="#9c3327" stroke-width="1.4"/><rect x="-15" y="-9.5" width="30" height="19" fill="#9c3327" fill-opacity="0.2"/><rect x="-15" y="-9.5" width="30" height="19" fill="#ded7c2" fill-opacity="0.55"/><rect x="-15" y="-9.5" width="30" height="19" fill="none" stroke="#9c3327" stroke-width="1.5"/><path d="M0 -7.52 L0 7.52" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9.7 -1.88 L9.7 -1.88" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4.07 5.27 L4.07 5.27" fill="none" stroke="#9c3327" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 128) scale(0.62)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M0 -7.13 L0 7.13" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9.19 -1.78 L9.19 -1.78" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3.86 4.99 L3.86 4.99" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></g><text x="0" y="30" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">on #139's candidate A, frame to frontage</text><text x="0" y="92" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">on #139's candidate B, symbol on the trace</text><text x="0" y="158" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">legend scale, 0.62</text></g></g><g transform="translate(40 497)"><rect width="1220" height="166" fill="#ded7c2" stroke="#2f3134" stroke-width="1"/><text x="14" y="24" font-size="14" fill="#2f3134" letter-spacing="0.6">All four arms in the staff hand</text><line x1="14" y1="33" x2="1206" y2="33" stroke="#2f3134" stroke-width="0.6" stroke-opacity="0.5"/><text x="14" y="137" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">The three marks #139 settled, with the fourth beside them. Its ship is a hull in plan, bow up, chosen because two of the seven battles are naval and this is the modern view — which is precisely the pair the aircraft</text><text x="14" y="152" font-size="11.5" font-style="italic" fill="#2f3134" fill-opacity="0.9">mark has to separate itself from, since a hull in plan and an aeroplane in plan are both narrow, pointed and upright.</text><g transform="translate(130 58)"><g transform="translate(0 0)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/><line x1="-8.75" y1="-6.48" x2="8.75" y2="6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/></g><text x="0" y="32" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">infantry</text><g transform="translate(150 0)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><line x1="-8.75" y1="6.48" x2="8.75" y2="-6.48" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round"/></g><text x="150" y="32" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">cavalry</text><g transform="translate(300 0)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M0 -9.72 Q6.16 0 0 9.72 Q-6.16 0 0 -9.72 Z" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linejoin="round"/></g><text x="300" y="32" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">ship</text><g transform="translate(480 0)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M-9.19 7.45 L0 -7.45 L9.19 7.45 L0 1.86 Z" fill="#2f3134" stroke="#2f3134" stroke-width="1.08" stroke-linejoin="round"/></g><text x="480" y="32" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">aircraft · A</text><g transform="translate(630 0)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M-9.19 7.45 L0 -7.45 L9.19 7.45 L0 1.86 Z" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linejoin="round"/></g><text x="630" y="32" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">aircraft · B</text><g transform="translate(780 0)"><rect x="-36" y="-9" width="72" height="18" fill="#2f3134" fill-opacity="0.22"/><rect x="-36" y="-9" width="72" height="18" fill="none" stroke="#2f3134" stroke-width="1.5"/><line x1="-36" y1="-9" x2="36" y2="-9" stroke="#2f3134" stroke-width="3.2" stroke-linecap="square"/><path d="M0 -7.13 L0 7.13" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9.19 -1.78 L9.19 -1.78" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3.86 4.99 L3.86 4.99" fill="none" stroke="#2f3134" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></g><text x="780" y="32" font-size="11" font-style="italic" fill="#2f3134" fill-opacity="0.85" text-anchor="middle">aircraft · C</text></g></g>
