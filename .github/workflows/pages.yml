# Builds the site with Vite and publishes it to GitHub Pages on every push to
# main. Pages is configured with "GitHub Actions" as its source, so this
# workflow is the only thing that writes the live site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published site
# is worse than a queued push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks ci.yml runs, repeated here rather than assumed: this
      # workflow triggers on the push independently of CI, so without them a
      # main with failing tests or a broken data file would still publish.
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      # `base` is /sandtable/ for the build (vite.config.ts), which is the path
      # Pages serves a project site under, and `vite/serve-data.ts` copies
      # data/ into dist/data/.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
