<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The library's title and description (#135). A battle replaces the title from main.ts; the description is the manifest's too, written once and used twice. -->
    <title>Marchpast — famous battles, played back on the map</title>
    <meta
      name="description"
      content="Famous battles played back on the map, phase by phase — the positions, the moves and the clock, drawn from public-domain primary sources. Cannae, the Nile, Copenhagen, Trafalgar."
    />

    <!-- The parchment the plate is drawn on, so a browser's own furniture matches the page. The site reads no operating-system preference, so this is the one colour either way (ADR-0029). -->
    <meta name="theme-color" content="#efe3c6" />

    <!-- The mark, at the sizes each place asks for. The SVG is the small cut and does not invert: nothing here follows the viewer's theme (ADR-0029). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- What a link to the library unfurls to: the mark, the name and the idea line on parchment, and never a battle the link does not point at (#135). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marchpast" />
    <meta property="og:title" content="Marchpast — famous battles, played back on the map" />
    <meta
      property="og:description"
      content="Famous battles played back on the map, phase by phase — the positions, the moves and the clock, drawn from public-domain primary sources. Cannae, the Nile, Copenhagen, Trafalgar."
    />
    <meta property="og:url" content="https://marchpast.com/" />
    <meta property="og:image" content="https://marchpast.com/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #efe3c6;
      }
      /* The plate above, the controls beneath: the canvas takes whatever height the controls leave. */
      body {
        display: flex;
        flex-direction: column;
      }
      canvas {
        display: block;
        flex: 1;
        min-height: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="controls"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
