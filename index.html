<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- head:page:begin -->
    <!--
      Everything between these two markers is what a page is *about*, and it is
      the one part of this document that differs from one URL to the next: the
      build emits `/<name>/index.html` for every battle by swapping this block
      for that battle's own (ADR-0028, `vite/pages.ts`). Nothing outside the
      markers is ever rewritten, and the markers themselves are the seam — so
      keep the title, the description, the `og:` block, the Twitter card and
      the canonical inside them, and the icons, the theme colour and the styles
      out. This note is inside them too, because what it describes is the
      **library's** head (#135) and no battle's page should carry it.

      A battle replaces the title from main.ts as well, at runtime, for the one
      route that never sees a page of its own: the legacy `?battle=` form.

      The description is written out three times, here twice and in
      site.webmanifest, which no static file can share: vite/public.test.ts
      holds the three copies to one string. It names the battles, and grows as
      they land.
    -->
    <title>Marchpast — famous battles, played back on the map</title>
    <meta
      name="description"
      content="Famous battles played back on the map, phase by phase — the positions, the moves and the clock, drawn from public-domain primary sources. Cannae, the Nile, Copenhagen, Trafalgar, the Little Bighorn."
    />

    <!-- What a link to the library unfurls to: the mark, the name and the idea line on parchment, and never a battle the link does not point at (#135). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marchpast" />
    <meta property="og:title" content="Marchpast — famous battles, played back on the map" />
    <meta
      property="og:description"
      content="Famous battles played back on the map, phase by phase — the positions, the moves and the clock, drawn from public-domain primary sources. Cannae, the Nile, Copenhagen, Trafalgar, the Little Bighorn."
    />
    <meta property="og:url" content="https://marchpast.com/" />
    <meta property="og:image" content="https://marchpast.com/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://marchpast.com/" />
    <!-- head:page:end -->

    <!-- The parchment the plate is drawn on, so a browser's own furniture matches the page. The site reads no operating-system preference, so this is the one colour either way (ADR-0029). -->
    <meta name="theme-color" content="#efe3c6" />

    <!-- The mark, at the sizes each place asks for. The SVG is the small cut and does not invert: nothing here follows the viewer's theme (ADR-0029). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The ground the last visit left, before anything is painted. The player's
      surface is derived from the view the viewer picked and written on the
      root by src/player/surface.ts, but that is a module and a module runs
      after first paint: without these three lines a viewer who chose the night
      plate meets a full screen of the default view's parchment first
      (ADR-0023). rememberView stores the resolved colour, so this copies no
      palette and knows no view ids.

      They are blind to the route, which they have to be — the route is the
      module's to work out, and there is no module yet. So a viewer who left a
      dark view and then opens the library gets that view's letterbox for the
      one paint before library.css claims the page back on .st-library-page.
      The library is never themed after that (ADR-0023, ADR-0029): the class
      and the list arrive together.
    -->
    <script>
      try {
        const ground = localStorage.getItem("marchpast.ground");
        if (ground) document.documentElement.style.setProperty("--st-edge", ground);
      } catch {}
    </script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* The one colour this file carries: the Chart plate's letterbox, for the
         first visit, which has nothing remembered to paint instead. */
      html {
        background: var(--st-edge, #d9c8a2);
      }
      /* The plate above, the controls beneath: the canvas takes whatever height the controls leave. */
      body,
      #player {
        display: flex;
        flex-direction: column;
      }
      #player {
        flex: 1;
        min-height: 0;
      }
      canvas {
        display: block;
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      /* The load notice replaces the canvas rather than covering it (#130), and the rule above would otherwise keep a hidden canvas on the page. */
      canvas[hidden] {
        display: none;
      }
      /*
        Read but not seen: the page's heading, the muster and the announcer — the plate's words for a viewer who cannot see it (#130).
        Clipped rather than `display: none`, which would take them out of the accessibility tree along with the picture. It is declared
        here rather than in player.css because the heading below is this file's own, and it must not flash before a stylesheet arrives.
      */
      .st-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- The plate, its heading and the strip, in one landmark. main.ts writes the battle's title into the heading and takes the whole of it off again on the library route, which is a <main> of its own. -->
    <main id="player">
      <h1 id="title" class="st-hidden">Marchpast</h1>
      <canvas></canvas>
      <div id="controls"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
