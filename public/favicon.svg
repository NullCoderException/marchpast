<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#2b2418">
  <!--
    The mark's small cut (#135): below about 24 the doubled rule cannot stay
    doubled — the gap falls under a pixel — so it is spent as one heavier bar,
    and the rank drops from three ticks to two. The tick that has passed stays:
    it is the only stroke the idea cannot lose. The full cut is src/app/mark.ts.

    Ink on transparent, and it does not invert: the site reads no
    operating-system preference (ADR-0029), so the favicon does not either.
  -->
  <line x1="1.5" y1="12.6" x2="14.5" y2="12.6" stroke-width="1"/>
  <line x1="3.2" y1="7.4" x2="3.2" y2="12.6" stroke-width="1.4"/>
  <line x1="5.6" y1="7.4" x2="5.6" y2="12.6" stroke-width="1.4"/>
  <line x1="9.4" y1="2.6" x2="9.4" y2="14.2" stroke-width="1.8"/>
  <line x1="13.2" y1="7.4" x2="13.2" y2="12.6" stroke-width="1.4"/>
</svg>
